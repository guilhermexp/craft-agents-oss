name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            target: mac
          - os: macos-13
            arch: x64
            target: mac
          - os: windows-latest
            arch: x64
            target: win

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies (pnpm with shamefully-hoist for electron-builder)
        shell: bash
        run: |
          rm -f bun.lock
          pnpm install --no-frozen-lockfile --shamefully-hoist --ignore-scripts
          pnpm rebuild

      - name: Download bun runtime for packaging
        shell: bash
        run: |
          BUN_VERSION="1.3.10"
          mkdir -p apps/electron/vendor/bun
          case "${{ matrix.os }}" in
            macos-14)
              curl -fL "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-darwin-aarch64.zip" -o /tmp/bun.zip
              unzip -j -o /tmp/bun.zip 'bun-darwin-aarch64/bun' -d apps/electron/vendor/bun/
              chmod +x apps/electron/vendor/bun/bun
              ;;
            macos-13)
              curl -fL "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-darwin-x64.zip" -o /tmp/bun.zip
              unzip -j -o /tmp/bun.zip 'bun-darwin-x64/bun' -d apps/electron/vendor/bun/
              chmod +x apps/electron/vendor/bun/bun
              ;;
            windows-latest)
              curl -fL "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-windows-x64.zip" -o /tmp/bun.zip
              unzip -j -o /tmp/bun.zip 'bun-windows-x64/bun.exe' -d apps/electron/vendor/bun/
              ;;
          esac
          ls -la apps/electron/vendor/bun/

      - name: Build artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run electron:dist:${{ matrix.target }}

      - name: Upload to release draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: apps/electron/release/Craft-Agents-*.{dmg,zip,exe,yml}
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}

  # Partial releases are allowed (fail-fast: false) but must never look
  # complete: flag the draft loudly when any platform artifact is missing.
  finalize:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Flag incomplete release draft
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            const draft = releases.find(r => r.tag_name === tag)
            if (!draft) {
              core.warning(`No release draft found for ${tag} — all builds may have failed before upload.`)
              return
            }
            const assets = draft.assets.map(a => a.name)
            const expected = [
              { platform: 'macOS arm64 (.dmg)', test: /arm64\.dmg$/ },
              { platform: 'macOS x64 (.dmg)', test: /x64\.dmg$/ },
              { platform: 'Windows x64 (.exe)', test: /\.exe$/ },
            ]
            const missing = expected
              .filter(e => !assets.some(name => e.test.test(name)))
              .map(e => e.platform)
            const MARKER_START = '<!-- release-completeness-start -->'
            const MARKER_END = '<!-- release-completeness-end -->'
            const stripped = (draft.body ?? '')
              .replace(new RegExp(`${MARKER_START}[\\s\\S]*?${MARKER_END}\\n?`, 'g'), '')
              .trim()
            let body = stripped
            let name = tag
            if (missing.length > 0) {
              const warning = [
                MARKER_START,
                `> [!WARNING]`,
                `> ⚠️ **INCOMPLETE — missing: ${missing.join(', ')}**`,
                `> Do not publish until every platform artifact is attached (or the gap is intentional and documented).`,
                MARKER_END,
              ].join('\n')
              body = body ? `${warning}\n\n${body}` : warning
              name = `${tag} ⚠️ INCOMPLETE — missing: ${missing.join(', ')}`
              core.warning(`Release draft ${tag} is incomplete — missing: ${missing.join(', ')}`)
            } else {
              core.info(`Release draft ${tag} has all expected platform artifacts.`)
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: draft.id,
              name,
              body,
            })
