<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src 'self' http://127.0.0.1:*; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' http://localhost:8097; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: file: thumbnail:; media-src 'self' data: blob: file: media:; connect-src 'self' https: http://localhost:* ws://localhost:* wss://localhost:* http://127.0.0.1:* ws://127.0.0.1:* wss://127.0.0.1:* wss:; font-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'self' file:;">
  <title>Craft Agents</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- impeccable-disable-next-line overused-font -- Inter is an explicit opt-in application preference documented in DESIGN.md. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <script>
    // React DevTools standalone (port 8097). Opt-in: run `localStorage.setItem('react-devtools','1')`
    // in DevTools console then reload. Otherwise we skip to avoid ERR_CONNECTION_REFUSED noise
    // when the standalone agent is not running.
    if ((location.protocol === 'file:' || location.hostname === 'localhost')
        && localStorage.getItem('react-devtools') === '1') {
      const s = document.createElement('script');
      s.src = 'http://localhost:8097';
      s.onerror = () => {};
      document.head.appendChild(s);
    } else if (location.protocol === 'file:') {
      // Keep the packaged Electron console clean by hiding React's generic
      // "Download the React DevTools" prompt. The standalone DevTools remain
      // available via the localStorage opt-in above.
      window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = {
        isDisabled: true,
        supportsFiber: true,
        inject: () => {},
        onCommitFiberRoot: () => {},
        onCommitFiberUnmount: () => {},
      };
    }
  </script>
  <div id="root">
    <!-- Initial loading state: visible until React mounts and replaces #root contents.
         Prevents blank screen on cold start / post-update launch when code cache is stale. -->
    <style>
      #_loader { display:flex; align-items:center; justify-content:center; height:100vh; opacity:0; animation:_fade 0.4s 0.3s forwards; }
      #_loader svg { width:24px; height:24px; animation:_spin 1s linear infinite; }
      @keyframes _fade { to { opacity:1 } }
      @keyframes _spin { to { transform:rotate(360deg) } }
      @media (prefers-color-scheme:dark) { #_loader svg { color:rgba(255,255,255,0.4) } }
      @media (prefers-color-scheme:light) { #_loader svg { color:rgba(0,0,0,0.3) } }
    </style>
    <div id="_loader"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke-linecap="round"/></svg></div>
  </div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
